nodeLinker: node-modules
enableGlobalCache: false

# Supply-chain protection: refuse any package published in the last 24h.
# Guards against typosquats and compromised releases being pulled in before
# the ecosystem has had a chance to react.
npmMinimalAgeGate: 1440

# First-party framework scopes are exempt: Expo ships SDK patches continuously
# and `expo install` pins exact `~x.y.z` ranges, so the gate would block routine
# upgrades. These are the packages the project already trusts implicitly.
npmPreapprovedPackages:
  - 'expo'
  - 'expo-*'
  - 'babel-preset-expo'
  - 'jest-expo'
  - 'eslint-config-expo'
  - '@expo/*'
  - 'react-native'
  - '@react-native/*'
  - '@react-native-community/*'
  - '@react-native-firebase/*'
  - '@react-native-async-storage/*'
