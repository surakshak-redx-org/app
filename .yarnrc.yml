nodeLinker: node-modules
enableGlobalCache: false

# Zero-install: the Yarn 4 binary itself is committed under .yarn/releases
# rather than resolved at install time. EAS's build image tries to install
# the pinned yarn version via `npm install -g yarn@<version>`, which only
# ever works for Yarn Classic (1.x) — the npm registry's `yarn` package never
# published Berry (3.x/4.x) releases beyond a 2.4.3 stub. Pointing yarnPath
# at the committed binary means EAS runs it directly and never needs to
# install/resolve a yarn version at all.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Supply-chain protection: refuse any package published in the last 24h.
# Guards against typosquats and compromised releases being pulled in before
# the ecosystem has had a chance to react.
npmMinimalAgeGate: 1440

# First-party framework scopes are exempt: Expo ships SDK patches continuously
# and `expo install` pins exact `~x.y.z` ranges, so the gate would block routine
# upgrades. These are the packages the project already trusts implicitly.
npmPreapprovedPackages:
  - 'expo'
  - 'expo-*'
  - 'babel-preset-expo'
  - 'jest-expo'
  - 'eslint-config-expo'
  - '@expo/*'
  - 'react-native'
  - '@react-native/*'
  - '@react-native-community/*'
  - '@react-native-firebase/*'
  - '@react-native-async-storage/*'
