name: Deploy

on:
  push:
    branches: [develop, staging, production]

jobs:
  decide-deploy-type:
    name: Decide Deploy Type
    runs-on: ubuntu-latest
    outputs:
      deploy_type: ${{ steps.check.outputs.type }}
      deploy_reason: ${{ steps.check.outputs.reason }}
      channel: ${{ steps.channel.outputs.name }}
      # EAS's own "environment" tier (development/preview/production) — distinct
      # from `channel` (develop/staging/production) and from our APP_ENV concept
      # (staging/prod). Must stay in sync with each profile's `environment`
      # field in eas.json, and with `eas env:list` on expo.dev.
      eas_environment: ${{ steps.channel.outputs.eas_environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set channel and EAS environment
        id: channel
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "production" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "eas_environment=production" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "staging" ]; then
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "eas_environment=preview" >> $GITHUB_OUTPUT
          else
            echo "name=develop" >> $GITHUB_OUTPUT
            echo "eas_environment=development" >> $GITHUB_OUTPUT
          fi

      # eas-cli is needed here (not just in the two downstream jobs) because
      # the bootstrap check below has to ask EAS's own build history whether
      # this profile has ever shipped a native build at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-
      - run: yarn install --immutable
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # An OTA update ships JS to an app shell that's already installed on a
      # device. If this profile has never had a successful native build, no
      # such shell exists anywhere — an "OTA" here would update nothing. Force
      # a real build the first time, regardless of what files changed.
      - name: Check for an existing build on this profile
        id: bootstrap
        run: |
          EXISTING=$(eas build:list \
            --status finished \
            --build-profile "${{ steps.channel.outputs.name }}" \
            --limit 1 --non-interactive --json)

          # Any failure to parse or reach EAS defaults to "no build" — an extra
          # build costs time; a wrongly-skipped first build ships nothing.
          if [ "$EXISTING" = "[]" ] || [ -z "$EXISTING" ]; then
            echo "has_build=false" >> $GITHUB_OUTPUT
          else
            echo "has_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if native build required
        id: check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          NEEDS_BUILD=false
          REASON="JS/TS only changes"

          if [ "${{ steps.bootstrap.outputs.has_build }}" = "false" ]; then
            NEEDS_BUILD=true; REASON="no finished build exists yet for this profile"
          fi
          if echo "$CHANGED" | grep -q "^package\.json$"; then
            NEEDS_BUILD=true; REASON="package.json changed"
          fi
          if echo "$CHANGED" | grep -q "^app\.config\.ts$"; then
            NEEDS_BUILD=true; REASON="app.config.ts changed"
          fi
          if echo "$CHANGED" | grep -q "^eas\.json$"; then
            NEEDS_BUILD=true; REASON="eas.json changed"
          fi

          if [ "$NEEDS_BUILD" = true ]; then
            echo "type=build" >> $GITHUB_OUTPUT
          else
            echo "type=ota" >> $GITHUB_OUTPUT
          fi
          echo "reason=$REASON" >> $GITHUB_OUTPUT

      - name: Write deploy summary
        run: |
          {
            echo "## 🚀 Deploy Decision"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Type | **${{ steps.check.outputs.type }}** |"
            echo "| Reason | ${{ steps.check.outputs.reason }} |"
            echo "| Channel | ${{ steps.channel.outputs.name }} |"
            echo "| EAS environment | ${{ steps.channel.outputs.eas_environment }} |"
            echo "| Branch | ${{ github.ref_name }} |"
          } >> $GITHUB_STEP_SUMMARY

  ota-update:
    name: EAS OTA Update
    needs: decide-deploy-type
    if: needs.decide-deploy-type.outputs.deploy_type == 'ota'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Decoded in THIS job on purpose: files and $GITHUB_ENV do not cross job
      # boundaries, so a separate "write config" job would leave this runner
      # with no Firebase config at all. APP_ENV and the Maps keys are NOT set
      # here — `eas update --environment` below pulls them from EAS's own
      # hosted Environment Variables instead. Job-level `env:` here would only
      # ever have reached local bundling, never `eas build`'s remote worker,
      # so hosted variables are the only mechanism that works for both paths.
      - name: Decode Firebase config
        env:
          GOOGLE_SERVICES_ANDROID: ${{ secrets.GOOGLE_SERVICES_ANDROID }}
          GOOGLE_SERVICES_IOS: ${{ secrets.GOOGLE_SERVICES_IOS }}
        run: |
          echo "$GOOGLE_SERVICES_ANDROID" | base64 --decode > google-services.json
          echo "$GOOGLE_SERVICES_IOS" | base64 --decode > GoogleService-Info.plist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-
      - run: yarn install --immutable

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: |
          eas update \
            --channel ${{ needs.decide-deploy-type.outputs.channel }} \
            --environment ${{ needs.decide-deploy-type.outputs.eas_environment }} \
            --message "OTA: ${{ github.event.head_commit.message }}" \
            --non-interactive

  eas-build:
    name: EAS Native Build
    needs: decide-deploy-type
    if: needs.decide-deploy-type.outputs.deploy_type == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode Firebase config
        env:
          GOOGLE_SERVICES_ANDROID: ${{ secrets.GOOGLE_SERVICES_ANDROID }}
          GOOGLE_SERVICES_IOS: ${{ secrets.GOOGLE_SERVICES_IOS }}
        run: |
          echo "$GOOGLE_SERVICES_ANDROID" | base64 --decode > google-services.json
          echo "$GOOGLE_SERVICES_IOS" | base64 --decode > GoogleService-Info.plist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-
      - run: yarn install --immutable

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # No --environment flag here (build has none) and no job-level env: —
      # `-e <profile>` is enough. Each profile in eas.json declares its own
      # `environment`, which is how EAS Build knows which hosted variables to
      # inject into the remote build container.
      - name: Build Android
        run: |
          eas build --platform android \
            --profile ${{ needs.decide-deploy-type.outputs.channel }} \
            --non-interactive --no-wait

      - name: Build iOS
        run: |
          eas build --platform ios \
            --profile ${{ needs.decide-deploy-type.outputs.channel }} \
            --non-interactive --no-wait
